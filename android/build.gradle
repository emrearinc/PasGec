buildscript {
    repositories {
        google() // Google Maven deposu
        mavenCentral() // Merkezi Maven deposu
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0" // Updated Kotlin version
        classpath 'com.google.gms:google-services:4.4.2' // En son sürümü kontrol edin
    }
}

allprojects {
    repositories {
        google() // Google Maven deposu
        mavenCentral() // Merkezi Maven deposu
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
