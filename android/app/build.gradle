plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin" // Flutter Gradle Plugin
}

android {
    namespace "com.example.pasgec" // Projenizin benzersiz kimliği
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "25.1.8937393" // Güncel NDK sürümü

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.pasgec" // Benzersiz Application ID
        minSdk = 23 // Minimum SDK Versiyonu
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' // Native ABI filtreleri
        }
    }

    buildTypes {
        release {
            // Kod karıştırmayı ve kaynak küçültmeyi etkinleştir
            minifyEnabled false
            shrinkResources false

            // Varsayılan ve özel ProGuard dosyalarını kullan
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // R8 hata ayıklama için ek ayarlar
            debuggable false
            // Release sürümü için imzalama yapılandırması
            signingConfig signingConfigs.debug
        }
        debug {
            // Debug sürümü için karıştırmayı devre dışı bırak
            minifyEnabled false
            shrinkResources false
        }
    }

    lintOptions {
        abortOnError false // Lint hatalarını engelle
    }

    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}" // Fazlalık kaynakları çıkar
        }
    }
}
apply plugin: 'com.google.gms.google-services'

flutter {
    source = "../.."
}
