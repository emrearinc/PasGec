plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin" // Flutter Gradle Plugin
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.example.pasgec" // Projenizin benzersiz kimliği
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "25.1.8937393" // Güncel NDK sürümü

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.pasgec.app" // Benzersiz Application ID
        minSdk = 23 // Minimum SDK Versiyonu
        targetSdk = flutter.targetSdkVersion
        versionCode 3 // Daha önce kullanılan sürüm kodundan daha büyük bir sayı girin
        versionName "1.0.3" // Opsiyonel: Sürüm adını da güncelleyebilirsiniz

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' // Native ABI filtreleri
        }
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false // Kod karıştırmayı devre dışı bırak
            shrinkResources false // Kaynak küçültmeyi devre dışı bırak
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false // Release sürümü hata ayıklamayı kapat
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    lintOptions {
        abortOnError false // Lint hatalarını engelle
    }

    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}" // Fazlalık kaynakları çıkar
        }
    }
}

apply plugin: 'com.google.gms.google-services'

flutter {
    source = "../.."
}
